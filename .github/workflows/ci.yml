name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Push and pull_request both fire on every commit to an open PR's branch (intentional -- CI
# should run on both), but each trigger type builds up its own history of now-stale runs as new
# commits land. Group by (workflow, ref): push and pull_request use different refs for the same
# commit (refs/heads/<branch> vs refs/pull/<n>/merge), so this cancels a branch's own superseded
# push runs and a PR's own superseded pull_request runs independently, without push and
# pull_request cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The published package supports Node >= 18.17, so we type-check, build
        # and pack on Node 18. The test runner (Vitest 4) requires Node >= 20
        # (it imports `styleText` from node:util), so the Test step below is
        # skipped on Node 18 and runs on 20/22/24.
        node: [18, 20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          # Lock to the version in your packageManager field. Yarn >= 4.17 is
          # required for the builtin typescript compat patch to understand the
          # TypeScript 7 (Go-native) package layout.
          corepack prepare yarn@4.17.1 --activate

      # Cache Yarn Berry artifacts (helps a lot for CI speed)
      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/unplugged
            .yarn/build-state.yml
            .pnp.cjs
            .pnp.loader.mjs
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Test
        # Vitest 4 requires Node >= 20; Node 18 verifies build + pack only.
        if: matrix.node != '18'
        run: yarn test

      - name: Pack (sanity)
        run: npm pack --dry-run
